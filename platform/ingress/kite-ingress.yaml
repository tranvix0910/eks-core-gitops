# Kite dashboard on the shared admin ALB (group eks-workload), its own port:
#
#   http://<alb-dns>:8088   -> Kite
#
# Kite runs with a cluster-wide ServiceAccount and has an in-browser terminal,
# so unlike the other admin tools this listener is NOT opened to 0.0.0.0/0.
# <ADMIN_CIDR> is filled in at apply time (step 2.5), e.g. your public IP /32:
#
#   sed "s|<ADMIN_CIDR>|$(curl -s -4 ifconfig.me)/32|" platform/ingress/kite-ingress.yaml \
#     | kubectl --context eks-workload apply -f -
#
# HTTP only: the ALB DNS name is not a domain we control, so no certificate can
# be issued for it. Credentials cross the Internet in clear text - keep the
# CIDR tight, or skip this Ingress and use port-forward instead.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kite
  namespace: kite-system
  annotations:
    alb.ingress.kubernetes.io/group.name: eks-workload
    alb.ingress.kubernetes.io/group.order: "60"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 8088}]'
    alb.ingress.kubernetes.io/inbound-cidrs: <ADMIN_CIDR>
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kite
                port:
                  number: 8080
