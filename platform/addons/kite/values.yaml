# Kite dashboard - chart oci://ghcr.io/kite-org/charts/kite 0.15.0
# Installed with Helm (see docs step 2.5). Secret "kite" must exist first.
replicaCount: 1
# SQLite on a RWO volume: stop the old Pod before the new one mounts it
deploymentStrategy:
  type: Recreate
secret:
  create: false
  existingSecret: kite
db:
  type: sqlite
  sqlite:
    persistence:
      pvc:
        enabled: true
        storageClass: gp3
        accessModes: [ReadWriteOnce]
        size: 5Gi
nodeSelector:
  role: infra
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 512Mi }
# Access is port-forward or platform/ingress/kite-ingress.yaml
ingress:
  enabled: false
