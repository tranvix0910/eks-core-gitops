# Workshop override: collect each node's pods once, including tainted Karpenter nodes.
controller:
  type: daemonset
  tolerations:
    - operator: Exists
  volumes:
    extra:
      - name: observability-ca
        secret:
          secretName: observability-alb-tls
alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  mounts:
    varlog: false
    extra:
      - name: observability-ca
        mountPath: /etc/alloy/ca
        readOnly: true
  configMap:
    create: true
    content: |
      discovery.kubernetes "pod" {
        role = "pod"
        selectors {
          role = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label = "app"
        }
      }
      loki.source.kubernetes "pod_logs" {
        targets = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }
      loki.process "pod_logs" {
        stage.static_labels {
          values = { cluster = "eks-workload" }
        }
        forward_to = [loki.write.default.receiver]
      }
      loki.write "default" {
        endpoint {
          url = "https://loki.observability.internal:3100/loki/api/v1/push"
          tls_config {
            ca_file = "/etc/alloy/ca/ca.crt"
          }
        }
      }
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
