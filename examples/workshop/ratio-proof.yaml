apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-ratio
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: workshop-ratio}
  template:
    metadata:
      labels: {app: workshop-ratio}
    spec:
      nodeSelector:
        workload: microservices
        capacity: on-demand
        kubernetes.io/arch: amd64
      tolerations:
        - key: workload
          operator: Equal
          value: microservices
          effect: NoSchedule
      containers:
        - name: proof
          image: public.ecr.aws/docker/library/busybox:1.37.0
          command: [sh, -c, 'echo workshop-ratio; while true; do sleep 60; done']
          resources:
            requests: {cpu: '3', memory: 128Mi}
            limits: {memory: 256Mi}
